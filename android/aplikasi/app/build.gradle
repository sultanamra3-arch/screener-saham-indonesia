plugins {
    id 'com.android.application'
}

android {
    namespace 'id.my.chartflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.my.chartflow.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
