name: Cek data F-Score (sekali)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: curl -sL https://raw.githubusercontent.com/sultanamra3-arch/screener-saham/main/data/stocks.json -o us_stocks.json
      - run: python probe/probe_fscore.py probe_result.json
      - name: Simpan hasil ke cabang probe-fscore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-fscore
          git rm -rfq --cached . > /dev/null
          git add -f probe_result.json
          git commit -qm "Hasil cek data F-Score"
          git push -f origin probe-fscore
