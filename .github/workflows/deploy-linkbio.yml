name: Pasang halaman link (link.chartflow.my.id)

on:
  push:
    branches: [main]
    paths: ["linkbio/**", ".github/workflows/deploy-linkbio.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # Folder subdomain di hosting (bukan rahasia). Kosong = belum dipasang.
      LINK_DIR: "public_html/link"
      SITE: https://link.chartflow.my.id
    steps:
      - uses: actions/checkout@v5
      - name: Cek pengaturan
        id: chk
        run: |
          if [ -z "$LINK_DIR" ] || [ -z "$FTP_SERVER" ]; then
            echo "### Halaman link belum dipasang: folder subdomain (LINK_DIR) belum diisi" >> "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Kirim ke hosting lewat FTP
        if: steps.chk.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          OPEN="set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\""
          # akun FTP bisa berawal di folder home (ada public_html) atau langsung di dalam public_html
          if LFTP_PASSWORD="$FTP_PASSWORD" lftp -c "$OPEN; cd public_html" 2>/dev/null; then T="$LINK_DIR"; else T="${LINK_DIR#public_html/}"; fi
          echo "Tujuan: $T"
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -c "$OPEN; mirror -R --parallel=4 linkbio/public \"$T\""
          sleep 3; code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/" || echo "belum bisa dibuka (DNS subdomain mungkin masih menyebar)")
          echo "### Halaman link terpasang di folder $T: $SITE → $code" >> "$GITHUB_STEP_SUMMARY"
