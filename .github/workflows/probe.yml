name: Uji coba akses data

on:
  push:
    paths:
      - "probe/probe.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pasang paket
        run: pip install requests pandas lxml "yfinance>=0.2.54"
      - name: Uji akses
        run: python probe/probe.py
      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/hasil.md probe/hasil.json
          git commit -m "Hasil uji coba akses data" || exit 0
          git push
