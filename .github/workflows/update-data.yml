name: Update data saham Indonesia

on:
  schedule:
    # 10:43 UTC Senin–Jumat = 17:43 WIB, setelah BEI tutup pukul 16.00.
    - cron: "43 10 * * 1-5"
    # Update harga tiap 30 menit selama jam bursa: 02:00–08:30 UTC = 09.00–15.30 WIB Senin–Jumat.
    # Jam istirahat dilewati (scripts/intraday_gate.py), kecuali sekali untuk ringkasan siang.
    - cron: "*/30 2-8 * * 1-5"
  workflow_dispatch:
    inputs:
      siang:
        description: "Update siang saja (harga sementara)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      INTRADAY: ${{ (github.event.schedule == '*/30 2-8 * * 1-5' || inputs.siang) && '1' || '0' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang paket
        run: pip install -r requirements.txt

      - name: Cek jam bursa (update 30 menit)
        if: env.INTRADAY == '1'
        run: python scripts/intraday_gate.py | tee -a "$GITHUB_ENV"

      - name: Ambil data dan hitung 7 metode
        if: env.SKIP != '1'
        run: python scripts/fetch_data.py

      - name: Simpan ke repository
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -c "import json;d=json.load(open('data/stocks.json'));i=d.get('intraday') or {};json.dump({'v':(i.get('at') or '')+'|'+(d.get('updatedAt') or ''),'p':d.get('priceDate')},open('data/ver.json','w'))"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)$([ "$INTRADAY" = 1 ] && echo ' (siang)')"
            git pull --rebase -q origin main || true
            git push
          fi

      - name: Kirim salinan ke chartflow.my.id (bila FTP sudah diatur)
        if: success() && env.SKIP != '1' && env.FTP_SERVER != ''
        continue-on-error: true
        run: |
          python scripts/build_chartflow_app.py id out_app
          sudo apt-get install -y -qq lftp > /dev/null
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; \
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\"; \
            mkdir -p -f ${FTP_DIR:-.}/_appfiles/id; mirror -R --parallel=4 out_app ${FTP_DIR:-.}/_appfiles/id; mkdir -p -f ${FTP_DIR:-.}/pub; mirror -R out_app_pub ${FTP_DIR:-.}/pub"
          echo "Salinan id terkirim ke chartflow.my.id/app/id/" >> "$GITHUB_STEP_SUMMARY"

      - name: Cek alarm harga pengguna ChartFlow
        if: success() && env.SKIP != '1' && env.FTP_SERVER != ''
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TG_TOKEN" ]; then echo "Token Telegram belum diatur"; exit 0; fi
          HOOK=$(printf '%s' "$TG_TOKEN:chartflow-hook" | sha256sum | cut -c1-48)
          r=$(curl -s -m 60 -X POST -d "k=$HOOK&m=id" https://chartflow.my.id/api/alarm_check.php -w " http=%{http_code}")
          echo "$r"; echo "- Alarm harga: $r" >> "$GITHUB_STEP_SUMMARY"

      - name: Kirim ringkasan ke Telegram
        if: success() && env.SKIP != '1'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py

      - name: Kirim peringatan gagal ke Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install -q requests || true
          python scripts/notify_telegram.py --failed
